name: Quick Jenkins Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of test to run'
        required: true
        default: 'basic'
        type: choice
        options:
        - basic
        - helm-only
        - jenkins-only

env:
  NAMESPACE: jenkins
  RELEASE: jenkins

jobs:
  quick-test:
    name: 'Quick Test'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Minikube
      if: github.event.inputs.test_type != 'helm-only'
      uses: medyagh/setup-minikube@master
      with:
        minikube-version: 'latest'
        kubernetes-version: 'v1.28.0'
        driver: 'docker'
        cpus: '2'
        memory: '4000'
        
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'
        
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'
        
    - name: Quick Helm Test
      if: github.event.inputs.test_type == 'helm-only' || github.event.inputs.test_type == 'basic'
      run: |
        echo "🧪 Quick Helm Test (2min timeout)"
        helm repo add bitnami https://charts.bitnami.com/bitnami
        helm repo update
        helm install test-nginx bitnami/nginx --set service.type=ClusterIP --wait --timeout=2m || {
          echo "❌ Helm test failed"
          exit 1
        }
        echo "✅ Helm test passed"
        helm uninstall test-nginx
        
    - name: Quick Jenkins Test
      if: github.event.inputs.test_type == 'jenkins-only' || github.event.inputs.test_type == 'basic'
      run: |
        echo "🧪 Quick Jenkins Test (5min timeout)"
        
        # Setup
        kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
        
        cat <<EOF | kubectl apply -f -
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: minikube-hostpath
        provisioner: k8s.io/minikube-hostpath
        volumeBindingMode: Immediate
        EOF
        
        # Install Jenkins
        helm repo add jenkins https://charts.jenkins.io
        helm repo update
        
        helm install $RELEASE jenkins/jenkins \
          -n $NAMESPACE \
          -f jenkins-jcasc-values.yaml \
          --wait \
          --timeout=5m \
          --atomic || {
            echo "❌ Jenkins test failed"
            kubectl get pods -n $NAMESPACE -o wide
            kubectl get events -n $NAMESPACE --sort-by='.lastTimestamp' | tail -5
            exit 1
          }
        
        echo "✅ Jenkins test passed"
        
    - name: Show Results
      if: always()
      run: |
        echo "📊 Test Results:"
        if [ "${{ github.event.inputs.test_type }}" == "basic" ] || [ "${{ github.event.inputs.test_type }}" == "jenkins-only" ]; then
          kubectl get pods -n $NAMESPACE || echo "No pods found"
          kubectl get svc -n $NAMESPACE || echo "No services found"
        fi 